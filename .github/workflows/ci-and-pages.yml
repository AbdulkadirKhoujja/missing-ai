name: Test and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and MCP integration tests
        run: npm test
      - name: Measure synthetic answer-coverage benchmark
        run: npm run benchmark
      - name: Measure candidate coverage separately (not deployed)
        run: npm run benchmark:candidate
      - name: Challenge suite on v1 baseline
        run: npm run benchmark:challenge
      - name: Challenge suite on v2 candidate
        run: npm run benchmark:candidate:challenge
      - name: Assemble static website
        run: |
          mkdir -p _site/shared _site/guides
          cp site/index.html site/privacy.html site/styles.css site/app.js site/config.js site/favicon.svg site/robots.txt site/sitemap.xml _site/
          cp site/guides/*.html _site/guides/
          cp shared/checker.mjs _site/shared/checker.mjs
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
